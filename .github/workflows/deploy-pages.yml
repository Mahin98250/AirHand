name: Deploy AirHand to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate before publishing
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run automated tests
        run: npm test
      - name: Verify deployment entry points
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app.js
          test -s gesture-engine.js
          grep -Eq 'app\.js\?v=[^"]+' index.html
          echo "Required site files and versioned app.js reference are present."

  deploy:
    name: Publish to GitHub Pages
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live HTML and exact JavaScript asset
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          html_file="$(mktemp)"
          js_file="$(mktemp)"
          trap 'rm -f "$html_file" "$js_file"' EXIT

          # Allow Pages/CDN propagation a short window, but fail loudly if still unavailable.
          fetched=0
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --retry 2 --retry-delay 2 "$SITE_URL" -o "$html_file"; then
              fetched=1
              break
            fi
            sleep 10
          done
          test "$fetched" -eq 1
          grep -qi 'AirHand' "$html_file"

          # Extract the exact local app.js src, including its cache-busting query.
          app_src="$(python3 - "$html_file" <<'PY'
          import re, sys
          html = open(sys.argv[1], encoding="utf-8").read()
          match = re.search(r'<script\b[^>]*\bsrc=["\']([^"\']*app\.js\?v=[^"\']+)["\']', html, re.I)
          if not match:
              raise SystemExit("ERROR: live HTML has no versioned app.js script reference")
          print(match.group(1))
          PY
          )"
          case "$app_src" in
            http://*|https://*) asset_url="$app_src" ;;
            /*) asset_url="${SITE_URL%/}$app_src" ;;
            ./*) asset_url="${SITE_URL%/}/${app_src#./}" ;;
            *) asset_url="${SITE_URL%/}/$app_src" ;;
          esac

          curl --fail --silent --show-error --location --retry 2 --retry-delay 2 "$asset_url" -o "$js_file"
          if ! cmp -s app.js "$js_file"; then
            echo "::error::Live app.js bytes do not match the committed app.js. Check deployment source, Pages configuration, and CDN/browser cache."
            echo "Committed SHA256: $(sha256sum app.js | cut -d' ' -f1)"
            echo "Live SHA256:      $(sha256sum "$js_file" | cut -d' ' -f1)"
            exit 1
          fi
          echo "PASS: live HTML responds and the versioned app.js matches the committed file byte-for-byte."
