name: Build AirHand Mobile APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airhand-android-build
  cancel-in-progress: false

jobs:
  build-debug-apk:
    name: Compile Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate Android project files
        shell: bash
        run: |
          set -euo pipefail
          test -s android/settings.gradle
          test -s android/build.gradle
          test -s android/app/build.gradle
          test -s android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/java/com/mahin98250/airhand/HandLandmarkerAnalyzer.kt
      - name: Download and verify pinned hand model
        run: bash android/download-hand-model.sh
      - name: Build debug APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Inspect APK contents
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -l "$apk" | grep -q 'assets/hand_landmarker.task'
          echo "PASS: APK exists and includes the verified on-device hand model."
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AirHand-Mobile-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
